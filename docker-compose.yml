services:
  db:
    image: postgres:16
    container_name: photoarena-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: photoarena
      POSTGRES_PASSWORD: photoarena
      POSTGRES_DB: photoarena
    volumes:
      - photoarena_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photoarena -d photoarena"]
      interval: 5s
      timeout: 5s
      retries: 20

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: photoarena-tunnel
    restart: unless-stopped
    network_mode: host
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-eyJhIjoiMGYyNjhlYzhiMGYwMzI3YjQ1MDA0ZDlmMzU5MzZlZjkiLCJ0IjoiNWE0MzgwY2ItNDgyZC00MGU1LTkyNWItYzUwNmFiYmM5ZTAxIiwicyI6IllUbGxORGxsTjJNdE1UUTVZeTAwWW1aa0xXRTRNRFF0WW1ZNU1HUmhOR05qWkdFMyJ9}
    command: tunnel --no-autoupdate run

volumes:
  photoarena_pg:

