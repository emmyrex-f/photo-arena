<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#201F1F" />
    <meta name="msapplication-TileColor" content="#201F1F" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Photo Arena is a premium walk-in portrait studio in Port Harcourt. Book a session online and receive 5% off."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Overpass+Mono:wght@400;500;600&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
    <title>Photo Arena — Port Harcourt Portrait Studio</title>
    <style>
      #pa-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #201f1f;
        transition: opacity 0.28s ease-out;
      }
      #pa-boot.is-done {
        opacity: 0;
        pointer-events: none;
      }
      #pa-boot .pa-shutter-spin {
        display: block;
        width: 80px;
        height: 80px;
        animation: pa-shutter-spin 1.15s linear infinite;
        transform-origin: 50% 50%;
      }
      @keyframes pa-shutter-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #pa-boot .pa-shutter-spin {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="pa-boot" role="status" aria-live="polite" aria-label="Loading Photo Arena">
      <img
        src="/android-chrome-192x192.png"
        alt=""
        width="80"
        height="80"
        class="pa-shutter-spin"
      />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
